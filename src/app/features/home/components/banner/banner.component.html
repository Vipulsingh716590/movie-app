<div class="hero-skeleton" *ngIf="!loaded()" aria-hidden="true"></div>

<section class="hero" *ngIf="loaded() && slides().length" aria-label="Featured movies"
  (mouseenter)="pause()" (mouseleave)="resume()" (focusin)="pause()" (focusout)="resume()">

  <article class="hero__slide" *ngFor="let movie of slides(); let i = index"
    [class.is-active]="i === active()" [attr.aria-hidden]="i !== active()">
    <div class="hero__bg" [style.backgroundImage]="'url(' + (movie.backdrop_path | posterUrl:'backdrop') + ')'"></div>
    <app-video-preview *ngIf="i === active() && video() as t" class="hero__video"
      [trailer]="t" [muted]="muted()" (failed)="onVideoFailed(t)"></app-video-preview>
    <div class="hero__gradient"></div>

    <div class="hero__content">
      <div class="hero__text">
        <span class="hero__eyebrow">Featured</span>
        <h2 class="hero__title">{{ movie.title }}</h2>

        <div class="hero__meta">
          <app-rating-badge *ngIf="movie.vote_average > 0" [rating]="movie.vote_average"></app-rating-badge>
          <span>{{ isUpcoming(movie) ? 'Coming' : 'Released' }} {{ movie.release_date | date:'MMM d, y' }}</span>
          <span class="hero__genre" *ngFor="let genre of movie.genres">{{ genre.name }}</span>
        </div>

        <p class="hero__overview">{{ movie.overview | truncate:200 }}</p>

        <div class="hero__actions">
          <button type="button" class="hero__btn hero__btn--primary" (click)="watchNow(movie)"
            [attr.tabindex]="i === active() ? 0 : -1">Watch Now</button>
          <a class="hero__btn hero__btn--ghost" [routerLink]="['/movie', movie.id]"
            [attr.tabindex]="i === active() ? 0 : -1">View Details</a>
        </div>
      </div>

      <img class="hero__poster" [src]="movie.poster_path | posterUrl" [alt]="movie.title">
    </div>
  </article>

  <button type="button" class="hero__mute" *ngIf="video()" (click)="toggleMute()"
    [attr.aria-label]="muted() ? 'Unmute trailer' : 'Mute trailer'">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path *ngIf="muted()" d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12a7 7 0 0 1-.9 3.4l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-6-8.5v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.2 4.2c-.7.5-1.4.9-2.2 1.1v2.1a9 9 0 0 0 3.6-1.7l2.1 2.1 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/>
      <path *ngIf="!muted()" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
    </svg>
  </button>

  <div class="hero__dots" *ngIf="slides().length > 1">
    <button type="button" class="hero__dot" *ngFor="let movie of slides(); let i = index"
      [class.is-active]="i === active()" [attr.aria-label]="'Show ' + movie.title"
      [attr.aria-current]="i === active()" (click)="go(i)"></button>
  </div>
</section>
